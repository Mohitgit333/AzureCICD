trigger:
- main

pool:
  name: MohitAgent1212
  demands:
  - Agent.Name -equals MohitAgent1212

steps:

- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- script: dotnet restore src/productservice/productservice.csproj
  displayName: 'Restore API'

- script: dotnet build src/productservice/productservice.csproj --configuration Release --no-restore
  displayName: 'Build API'

- script: dotnet publish src/productservice/productservice.csproj --configuration Release --output $(Build.ArtifactStagingDirectory)/publish
  displayName: 'Publish API'

- task: ArchiveFiles@2
  displayName: 'Create Deployment Package'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/productservice.zip'
    replaceExistingArchive: true

- task: AzureWebApp@1
  displayName: 'Deploy to Azure Web App'
  inputs:
    azureSubscription: 'MohitServiceConnection111'
    appType: 'webApp'
    appName: 'MohitWebApp111'
    package: '$(Build.ArtifactStagingDirectory)/productservice.zip'
    deploymentMethod: 'zipDeploy'